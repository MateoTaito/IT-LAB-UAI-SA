server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Manejar la aplicación en /sa_it_lab_uai/
    location /sa_it_lab_uai/ {
        # Quitar el prefijo /sa_it_lab_uai/ para buscar archivos
        rewrite ^/sa_it_lab_uai/(.*)$ /$1 break;
        # Sirve los archivos estáticos si existen, si no, entrega index.html
        try_files $uri $uri/ /index.html;
    }

    # Cache largo para los assets (js, css, imágenes, etc.)
    location /sa_it_lab_uai/assets/ {
        # Quitar el prefijo /sa_it_lab_uai/ para buscar archivos
        rewrite ^/sa_it_lab_uai/(.*)$ /$1 break;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Redirigir raíz del dominio a /sa_it_lab_uai/
    location = / {
        return 301 /sa_it_lab_uai/;
    }
}
